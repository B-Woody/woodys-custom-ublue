# 99-woody-mac-randomize.conf — per-connection, per-boot generated MACs.
#
# Why 99-: Fedora/Bazzite ship /usr/lib/NetworkManager/conf.d/22-wifi-mac-addr.conf
# defaulting Wi-Fi profiles to wifi.cloned-mac-address=stable-ssid. Files in
# /etc/NetworkManager/conf.d are read after /usr/lib and sections from the later
# file win; matched sections mirror the Fedora file's format so precedence is
# unambiguous (later file, same section kind => this wins).
#
# Effect: MAC = hash(connection.stable-id); stable-id includes ${BOOT}, so each
# connection gets a fresh MAC on every boot.
# Note: connection.stable-id also drives IPv6 stable-privacy addressing and the
# DHCP client-id for these profiles (same ID, intended).
#
# Verify: NetworkManager --print-config | grep -iE 'cloned-mac|stable-id'

[connection-99-woody-wifi-mac]
match-device=type:wifi
wifi.cloned-mac-address=stable
connection.stable-id=${CONNECTION}/${BOOT}

[connection-99-woody-ethernet-mac]
match-device=type:ethernet
ethernet.cloned-mac-address=stable
connection.stable-id=${CONNECTION}/${BOOT}

[device]
wifi.scan-rand-mac-address=yes
