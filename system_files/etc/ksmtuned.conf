# ksmtuned configuration — tuned for VM-heavy use.
#
# Stock (KSM_THRES_COEF=20) only enables KSM when free memory drops below ~20%
# of RAM, which on a large-RAM machine can stay false even with many VMs
# running. 80 keeps KSM active through VM sessions, and it still stops when the
# system is idle. Delete this file to return to stock behaviour.
#
# Reference: `man ksmtuned.conf` / the stock file shipped by the ksmtuned package.

KSM_THRES_COEF=80

# KSM_THRES_CONST=2048
# KSM_MONITOR_INTERVAL=60
# KSM_NPAGES_BOOST=300
# KSM_NPAGES_DECAY=-50
# KSM_NPAGES_MIN=64
# KSM_NPAGES_MAX=1250

# Uncomment for tuning visibility (decisions get logged to the file):
# LOGFILE=/var/log/ksmtuned
# DEBUG=1
