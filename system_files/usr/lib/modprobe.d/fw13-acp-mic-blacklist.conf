# Framework Laptop 13 (AMD Ryzen AI 300 series / Krackan Point, e.g. Ryzen AI 9 HX 370)
# Internal microphone fix — work around a faulty Framework BIOS ACPI table.
#
# Root cause
# ----------
# The Framework BIOS advertises an AMD Audio Coprocessor (ACP) device in the ACPI
# tables (PCI 1022:15e2) that is NOT wired to the microphone array on this
# mainboard. The ACP PCI/legacy machine drivers bind to it anyway and register a
# phantom sound card (`acp-pdm-mach`, exposed as `card 2`). Two consequences:
#
#   1. The phantom card exposes a DMIC capture device that produces garbage:
#      a constant full-scale (clipped) PCM stream instead of real audio.
#   2. ALSA UCM (`/usr/share/alsa/ucm2/HDA/HDA.conf`) finds the phantom ACP card
#      and rewrites the HDA profile mapping, demoting the real (working) ALC285
#      analog microphone and auto-selecting a profile that routes capture to the
#      broken ACP path. Result: the internal mic is unusable out of the box.
#
# On Krackan Point there is no working Linux ACP/SOF firmware path yet, so the
# ACP card serves no purpose on this machine. Blacklisting the ACP modules keeps
# the phantom card from registering; UCM then falls back to the plain ALC285
# analog path, where the internal microphone works normally.
#
# Upstream tracking
# -----------------
#   FrameworkComputer/SoftwareFirmwareIssueTracker#166  (BIOS ACPI bug, open)
#   alsa-project/alsa-ucm-conf#673 / #688               (UCM changes; FW13 left broken)
#   NixOS/nixos-hardware#1603 + PR #1744                (same blacklist, NixOS only)
#
# Revisit if/when Framework fixes the ACPI tables in a BIOS update, or a kernel
# quirk / working ACP70 SOF firmware lands. The correct long-term fix is the BIOS.

blacklist snd_acp_pci
blacklist snd_acp70
blacklist snd_acp_legacy_mach
blacklist snd_acp_mac
