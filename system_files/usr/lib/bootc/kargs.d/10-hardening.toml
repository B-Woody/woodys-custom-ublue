# Kernel hardening — SecureBlue-derived, pruned for AMD Ryzen AI 300 (Framework 13).
# This is most (but not all) of the kargs from SecureBlue, with the lockdown mode
# removed so KSM still works and SMT left enabled — as before.
#
# Dropped from the SecureBlue list (with reasons):
#   intel_iommu=on, kvm-intel.vmentry_l1d_flush=always, l1d_flush=on  -> Intel-only (no-op here)
#   l1tf=full,force                                                   -> L1TF is an Intel bug; mitigation bails elsewhere
#   ssbd=force-on                                                     -> ARM64 spelling of the param; ignored on x86_64
#   pti=on                                                            -> forces Page Table Isolation; pure cost on AMD
#   spec_store_bypass_disable=on, spectre_v2=on                       -> AMD auto defaults are fine (re-add for max posture)
#   initcall_blacklist=algif_aead_init                                -> workaround for CVE-2026-31431; REMOVABLE once the
#                                                                        kernel build includes the fix (re-check `rpm -q kernel`)
#
# Power/battery trade-offs applied 2026-10 (see README "Framework 13 power tuning"):
#   init_on_free            -> dropped (kept init_on_alloc=1). Zeroing on every free is the
#                              most expensive of the init_on_* pair — constant memory
#                              traffic and CPU wakeups. init_on_alloc=1 still blocks the
#                              main use-after-free info-leak class, so this keeps most of
#                              the hardening for a measurable idle-power win.
#   iommu.strict=1          -> dropped (kernel default "lazy" flush retained). Strict DMA
#                              TLB invalidation flushes per-unmap and keeps the IOMMU busy;
#                              lazy is the upstream default precisely because strict costs
#                              throughput/power for negligible real-world benefit.
#   amd_pstate=guided       -> ADDED. Gives the power-profile EPP hints (tuned-ppd on
#                              Bazzite) more influence than the fully-autonomous,
#                              performance-biased default ("active"). FW13 AMD users
#                              report lower idle discharge; the size of the win varies
#                              (the dramatic "halved power" reports come from systems
#                              not using amd_pstate at all — not this case).
#                              Alternatives: "active" (kernel default) or "passive"
#                              (legacy; known to misbehave on some AMD laptops).
#   amdgpu.abmlevel=2       -> ADDED. Adaptive Backlight Management — a panel-side algorithm
#                              that trims backlight power on dark content (~0.3-1W). Level 2
#                              is the usual "no visible degradation" sweet spot; 3-4 are
#                              visibly aggressive on light content. Set 0 to disable
#                              (kernel 6.8+ exposes a runtime DRM property too).
kargs = [
  "amd_pstate=guided",
  "amdgpu.abmlevel=2",
  "init_on_alloc=1",
  "iommu=force",
  "iommu.passthrough=0",
  "kvm.mitigate_smt_rsb=1",
  "loglevel=0",
  "mitigations=auto",
  "module.sig_enforce=1",
  "page_alloc.shuffle=1",
  "proc_mem.force_override=ptrace",
  "random.trust_bootloader=off",
  "random.trust_cpu=off",
  "randomize_kstack_offset=on",
  "rd.emergency=halt",
  "rd.shell=0",
  "slab_nomerge",
  "vdso32=0",
  "vsyscall=none",
]
