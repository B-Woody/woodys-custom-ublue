# Framework 13 AMD — suspend-then-hibernate policy.
#
# Only the [Sleep] section is valid in a sleep.conf.d drop-in (man
# systemd-sleep.conf(5)). The behaviour is enabled by the pairing drop-in at
# systemd/system/systemd-suspend.service.d/10-fw13-suspend-then-hibernate.conf,
# which routes plain "suspend" through suspend-then-hibernate.
#
# Net effect: lid close / systemctl suspend enters RAM suspend as usual, then
# after HibernateDelaySec systemd wakes on an RTC alarm, writes the image to
# swap and powers off — so the laptop no longer drains overnight in a bag.
#
# REQUIREMENTS: hibernate needs swap >= RAM (`swapon --show`). The resume half
# is incompatible with Secure Boot + kernel signature enforcement. On failure
# systemd falls back to the suspend-after-failed-hibernate path (harmless).

[Sleep]
# Time spent in suspend before hibernating. 3h is a reasonable "closed for the
# evening" window; set 0 (or remove this file + the pairing drop-in) to revert
# to plain suspend.
HibernateDelaySec=180min

# Don't start the hibernate countdown while on AC — only when unplugged. Keeps
# the fast-resume behaviour at a desk. Remove if you want it always.
HibernateOnACPower=no

# Suspend mode for the RAM phase. s2idle is what FW13 AMD exposes
# (`cat /sys/power/mem_sleep`); leave unset to respect the kernel default.
#SuspendState=mem

# Hibernate mode written to /sys/power/disk. Unset = kernel default
# ("platform shutdown" on most systems).
#HibernateMode=platform shutdown
