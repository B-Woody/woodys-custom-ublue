# Hibernation is deliberately disabled on this machine (Woody's Framework 13).
#
# Why (2026-10):
#  * Secure Boot is a hard requirement here (anti-tamper for a laptop that
#    travels). The hibernate/resume image is an unsigned blob the boot chain
#    cannot verify, and resuming from it can bypass Secure Boot — the kernel
#    keeps a dedicated lockdown hook (LOCKDOWN_HIBERNATION) for exactly this.
#  * It cannot work on this machine anyway: the only swap is zram (RAM-backed),
#    which systemd ignores when looking for a hibernation device, and no
#    resume= device is configured. An image written to zram could never be
#    resumed after power-off.
#
# Plain suspend (s2idle) is unaffected and remains the sleep mode.
# To ever re-enable hibernation: delete this file, add a persistent (encrypted)
# swap >= RAM plus a resume= karg, and accept the weaker anti-tamper story.
[Sleep]
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
