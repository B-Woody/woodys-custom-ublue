# Framework 13 AMD — route plain suspend through suspend-then-hibernate.
#
# "systemctl suspend" (lid close, menu suspend, etc.) still enters RAM suspend,
# but after HibernateDelaySec (set in sleep.conf.d) systemd wakes to an RTC
# alarm and hibernates instead of sipping battery all night. This is the
# standard fix for the FW13 AMD "drains in the bag/overnight" behaviour.
#
# ExecStart= with no value clears the vendor line before the replacement; both
# lines are required. Vendor unit lives at
# /usr/lib/systemd/system/systemd-suspend.service.
#
# REQUIREMENTS / CAVEATS:
#   - Swap must be >= RAM for the hibernate half to work (`swapon --show`).
#   - The hibernate/resume half is incompatible with Secure Boot + kernel
#     module signature enforcement (this image sets module.sig_enforce=1), so
#     on a Secure Boot machine the hibernate half may fail and systemd falls
#     back to the suspend-after-failed-hibernate path. Harmless, but check
#     `journalctl -u systemd-suspend` after the first overnight test.
#   - To revert to plain suspend: remove this drop-in (or set HibernateDelaySec=0).
#
# References:
#   man systemd-suspend.service(8), man systemd-sleep.conf(5)

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-sleep suspend-then-hibernate
