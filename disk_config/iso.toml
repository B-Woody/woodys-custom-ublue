# Consolidated ISO config — the single file the build-disk workflow expects.
# Installer spokes kept minimal (parity with bazzite-dx); the bootc image and its
# first-boot experience handle the rest.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/b-woody/woodys-custom-ublue:latest
%end
"""

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Storage"]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]
